name = "sentinel"
main = "src/index.js"
compatibility_date = "2026-05-03"

[assets]
directory = "../client/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "CACHE"
id = "b9aea1eccd2841ec9824d83558a80529"

[[d1_databases]]
binding = "DB"
database_name = "sentinel-events"
database_id = "09319af0-04a2-4d18-8eb7-6ab5c6262673"

[observability]
enabled = true

# no per-request logs (they include URLs and queries); delete these 2 lines to turn back on
[observability.logs]
invocation_logs = false

# starts the GitHub Actions events import, see worker/src/scheduled.js
[triggers]
crons = ["5-59/15 * * * *"] # :05/:20/:35/:50

# per-IP request limits, see src/lib/rateLimit.js
[[ratelimits]]
name = "RL_KEYS_TEST"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "RL_NEWS"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_EVENTS"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_LIGHT"
namespace_id = "1004"
simple = { limit = 10, period = 60 }

# browsing countries fires one per country (mostly KV hits)
[[ratelimits]]
name = "RL_OFFICEHOLDERS"
namespace_id = "1005"
simple = { limit = 30, period = 60 }
