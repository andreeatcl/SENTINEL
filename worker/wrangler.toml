name = "sentinel"
main = "src/index.js"
compatibility_date = "2026-05-03"

[assets]
directory = "../client/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "CACHE"
id = "b9aea1eccd2841ec9824d83558a80529"

# see worker/src/scheduled.js.
[triggers]
crons = ["*/15 * * * *"]

# per-IP request limits, see src/lib/rateLimit.js
[[ratelimits]]
name = "RL_KEYS_TEST"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "RL_NEWS"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_EVENTS"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_LIGHT"
namespace_id = "1004"
simple = { limit = 10, period = 60 }

# browsing countries fires one per country (mostly KV hits)
[[ratelimits]]
name = "RL_OFFICEHOLDERS"
namespace_id = "1005"
simple = { limit = 30, period = 60 }
